version: 2

project_name: flink-tui

builds:
  - main: ./cmd/flink-tui
    binary: flink-tui
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/guide.md

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
