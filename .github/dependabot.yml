# Dependabot version updates. Options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Demo job used by compose.yml. Flink artifacts must match the Flink image
  # version in compose.yml and demo-job/Dockerfile, so bump them manually.
  - package-ecosystem: "maven"
    directory: "/demo-job"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "org.apache.flink:*"
    groups:
      demo-job-maven:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/demo-job"
    schedule:
      interval: "monthly"
